<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo Numérico - Prototipo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 { color: #2c3e50; font-size: 24px;}
        h3 { color: #7f8c8d; font-size: 16px; margin-bottom: 20px;}
        .info-box {
            background: #e8f4f8;
            padding: 15px;
            border-left: 4px solid #3498db;
            margin-bottom: 20px;
        }
        .input-group { margin-top: 15px; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { 
            padding: 9px 15px; background: #3498db; color: white; 
            border: none; border-radius: 4px; cursor: not-allowed; opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ Módulo de Ecuaciones No Lineales</h1>
        <h3>Equipo: Paul (P), Renato (M), Massiel (D) y Ronald (V)</h3>
        
        <div class="info-box">
            <strong>Caso de calibración activo:</strong> <br>
            f(x) = x³ - x - 2 = 0
        </div>

        <p><em>Entorno de trabajo local inicializado. Pendiente integración del motor Python/JS.</em></p>

        <div class="input-group">
            <label>Punto Inicial (x₀):</label>
            <input type="text" value="1.5" disabled>
            <button disabled>Ejecutar Newton (En desarrollo)</button>
        </div>
    </div>
</body>
</html>
